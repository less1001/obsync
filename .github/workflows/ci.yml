name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install esbuild and build plugin
      run: |
        npm install esbuild typescript --no-save
        npx esbuild main.ts --bundle --external:obsidian --format=cjs --target=es2018 --outfile=main.js
